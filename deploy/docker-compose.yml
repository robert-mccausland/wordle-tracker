version: '3.8'

services:
  wordle-tracker:
    image: ghcr.io/robert-mccausland/wordle-tracker:${VERSION}
    restart: unless-stopped
    # Memory cap (ZOO-52): a leak gets this container OOM-killed and restarted
    # instead of starving the whole VM (ZOO-49). The swap cap matches, so it
    # can't spill into swap either. Override with the MEM_LIMIT GitHub
    # environment variable, which the Release workflow writes to .env.
    # docker-compose 1.27.4 honours mem_limit in a version 3.x file
    # (deploy.resources can't cap swap).
    mem_limit: ${MEM_LIMIT:-192m}
    memswap_limit: ${MEM_LIMIT:-192m}
    environment:
      DB_PATH: /var/lib/wordle-tracker/data/
      SYNC_COMMANDS: "TRUE"
      TOKEN: ${TOKEN}
      VERSION: ${VERSION}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

    volumes:
      - wordle-tracker-data:/var/lib/wordle-tracker/data

    networks:
     - shared-network

volumes:
  wordle-tracker-data:
    driver: local

networks:
  shared-network:
    external: true
    name: shared-network
